<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">WorkBuddy XHS Skills</title>
  <desc id="desc">An editorial collage showing the Xiaohongshu content system from positioning to review.</desc>
  <rect width="1200" height="500" rx="28" fill="#fff5f0"/>
  <circle cx="1030" cy="92" r="180" fill="#ff7a66" opacity=".18"/><circle cx="1090" cy="390" r="150" fill="#e94862" opacity=".14"/>
  <g transform="rotate(-5 230 258)"><rect x="62" y="88" width="320" height="286" rx="18" fill="#ffffff" stroke="#f3c6bd" stroke-width="2"/><text x="92" y="132" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" letter-spacing="3" fill="#e94862">XHS / CONTENT DESK</text><text x="92" y="194" font-family="Georgia,serif" font-size="39" fill="#3d2630">From idea</text><text x="92" y="238" font-family="Georgia,serif" font-size="39" fill="#3d2630">to publishable</text><path d="M92 270h220" stroke="#ff7a66" stroke-width="5" stroke-linecap="round"/><text x="92" y="318" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#80515b">position · hook · proof</text></g>
  <g transform="translate(470 92)" font-family="ui-sans-serif,system-ui,sans-serif">
    <text x="0" y="0" font-size="13" letter-spacing="4" fill="#e94862">WORKBUDDY XHS SKILLS / 10 ROUTES</text>
    <text x="0" y="58" font-family="Georgia,serif" font-size="47" fill="#3d2630">A content system</text>
    <text x="0" y="96" font-family="Georgia,serif" font-size="47" fill="#3d2630">with a visual hand.</text>
    <g transform="translate(0 142)"><rect width="198" height="74" rx="12" fill="#e94862"/><text x="20" y="31" font-size="12" letter-spacing="2" fill="#fff5f0">01 / THINK</text><text x="20" y="56" font-size="19" fill="#fff">定位 · 选题</text></g>
    <g transform="translate(216 142)"><rect width="198" height="74" rx="12" fill="#ff7a66"/><text x="20" y="31" font-size="12" letter-spacing="2" fill="#fff5f0">02 / SHAPE</text><text x="20" y="56" font-size="19" fill="#fff">改稿 · 人味</text></g>
    <g transform="translate(432 142)"><rect width="198" height="74" rx="12" fill="#f4b54a"/><text x="20" y="31" font-size="12" letter-spacing="2" fill="#573b23">03 / SHOW</text><text x="20" y="56" font-size="19" fill="#573b23">视觉 · 排期</text></g>
